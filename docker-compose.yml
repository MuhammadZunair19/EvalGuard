services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: evalguard
      POSTGRES_USER: evalguard
      POSTGRES_PASSWORD: evalguard
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evalguard"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://evalguard:evalguard@postgres:5432/evalguard
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      CHROMA_PATH: /app/runtime/chroma
      UPLOAD_PATH: /app/runtime/uploads
    ports: ["8000:8000"]
    volumes: ["backend_data:/app/runtime"]
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports: ["3000:3000"]
    depends_on: [backend]

  ollama:
    image: ollama/ollama:latest
    profiles: ["local-ai"]
    ports: ["11434:11434"]
    volumes: ["ollama_data:/root/.ollama"]

volumes:
  postgres_data:
  backend_data:
  ollama_data:
